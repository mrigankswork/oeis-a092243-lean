# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "OEIS A092243: the prime-gap tug-of-war score is positive for some n > 250000"
  description: >-
    A kernel-checked Lean 4 proof that the prime-gap "tug of war" score of OEIS A092243
    becomes positive again after n = 250000. This answers the question "Is s > 0 for some
    n > 250000?" asked in the OEIS entry. The score is a(n) = sum over k = 2..n of
    sign(g(k) - g(k-1)), where g(k) = p(k) - p(k-1) is the k-th prime gap and primes are
    counted from p(0) = 2. The proof shows a(261150) = 1. The statement is the formal-conjectures
    formalization OeisA92243.conjecture1, copied verbatim. The proof is a computation checked
    entirely by Lean's kernel. The kernel sieves the primes below 3,666,582 in 381 blocks with a
    gcd test and folds the score over them, and a soundness argument connects this computation to
    Mathlib's Nat.nth Nat.Prime. No native_decide is used. The numerical value is not new: it
    already appears in N. J. A. Sloane's table of a(n) for n <= 965,562, linked from the OEIS
    entry. The contribution is the machine-checked proof.
  authors:
    - "Mrigank"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mrigank"

