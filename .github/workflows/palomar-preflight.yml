# Palomar mechanical preflight: runs Palomar's own reusable verification workflow (build, Comparator with
# the Lean kernel and the independent NanoDa / con-ron kernels) on GitHub's Linux runners. Run it by hand
# (Actions tab, or `gh workflow run palomar-preflight.yml`) before submitting a commit to Palomar.
name: Palomar preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@046554302064b2c83c2b924bea6db87fc5900c68
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 046554302064b2c83c2b924bea6db87fc5900c68
      request_id: preflight002
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
